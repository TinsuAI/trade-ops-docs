<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeOps — Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="app-body">
    <div class="shell-noise"></div>

    <header class="topnav">
        <div class="topnav-primary">
            <a href="#/dashboard" class="topnav-brand">
                <span class="topnav-brand-mark">TO</span>
                <span class="topnav-brand-label">TradeOps</span>
            </a>
            <nav class="topnav-links" aria-label="Điều hướng chính">
                <a href="#/dashboard" class="topnav-link" data-nav="dashboard">Tổng quan</a>
                <a href="#/clients" class="topnav-link" data-nav="clients">Khách hàng</a>
                <a href="#/dossier-list" class="topnav-link" data-nav="dossiers">Hồ sơ</a>
                <a href="#/audit-trail" class="topnav-link" data-nav="log">Nhật ký</a>
            </nav>
            <div class="topnav-primary-end">
                <span class="topnav-chip topnav-chip-mockup" title="Đây là mockup workshop. Mọi số liệu là giả lập.">Mockup · giả lập</span>
                <button class="topnav-chip topnav-chip-q" id="q-toggle" title="Mở câu hỏi mở cho phiên (phím Q)" aria-label="Câu hỏi mở">
                    Phiên hỏi đáp <span style="font-family: var(--font-mono); font-size: 0.7rem; padding: 0 0.25rem; background: rgba(0,0,0,0.06); border-radius: 3px; margin-left: 0.15rem;">Q</span>
                </button>
                <span class="topnav-chip" title="Đại lý đang đăng nhập">Đại lý ABC</span>
            </div>
        </div>
        <div class="topnav-crumb" id="crumb"></div>
    </header>

    <div class="app-main">
        <main class="shell" id="view">
            <div class="view-loading">Đang tải…</div>
        </main>
    </div>

    <div class="q-overlay" id="q-overlay" aria-hidden="true">
        <div class="q-overlay-card" role="dialog" aria-label="Câu hỏi mở cho phiên này">
            <div class="q-overlay-eyebrow">Câu hỏi mở cho phiên</div>
            <div id="q-overlay-body"></div>
            <div class="q-overlay-foot">
                <span>Đóng bằng phím <kbd>Esc</kbd> hoặc <kbd>Q</kbd></span>
                <span>Cho guide xem · không hiển thị mặc định</span>
            </div>
        </div>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
